[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[project]
name = "oysterworld"
version = "0.1.0"
description = "OysterWorld AutoResearch — turn a grain of real data into a world of synthetic datasets"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scikit-optimize>=0.10",
    "fastapi>=0.109",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "structlog>=24.1",
]

[project.optional-dependencies]
sim = [
    "pybullet>=3.2.6",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "hypothesis>=6.98",
    "httpx>=0.27",
    "ruff>=0.2",
]

[project.scripts]
ow-optimize = "scripts.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py311"
line-length = 100
