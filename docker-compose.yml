services:
  physicalfish:
    build: .
    ports:
      - "8000:8000"
    environment:
      - PHYSICALFISH_LOG_LEVEL=INFO
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
